<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drumio</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/themes.css?v=11" />
    <link rel="stylesheet" href="css/style.css?v=11" />
    <link rel="stylesheet" href="css/metronome.css?v=11" />
    <link rel="stylesheet" href="css/rudiments.css?v=11" />
    <link rel="stylesheet" href="css/drills.css?v=11" />
    <link rel="stylesheet" href="css/modal.css?v=11" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">Drumio</h1>
        <nav class="nav">
          <a href="#" class="nav-link active" data-section="Metronome" data-i18n="nav.metronome">Metronome</a>
          <a href="#" class="nav-link" data-section="Rudiments" data-i18n="nav.rudiments">Rudiments</a>
          <a href="#" class="nav-link" data-section="Drills" data-i18n="nav.drills">Drills</a>
        </nav>
        <select class="lang-select" id="langSelect" aria-label="Select language">
          <option value="en">EN</option>
          <option value="tr">TR</option>
        </select>
        <button class="theme-toggle" id="themeToggle" data-i18n-aria="theme.toggleAria" aria-label="Toggle dark mode">
          ☀️
        </button>
      </div>
    </header>

    <main class="main-content" id="app">

      <!-- ── Metronome ───────────────────────────────────────── -->
      <section class="metronome container" id="metronome-section">
        <div class="card metronome-card">

          <!-- Beat indicator -->
          <div class="beat-indicator" id="beatIndicator" aria-hidden="true"></div>

          <!-- BPM display -->
          <div class="bpm-display">
            <div
              class="bpm-number"
              id="bpmNumber"
              role="spinbutton"
              aria-label="BPM"
              aria-valuenow="100"
              aria-valuemin="20"
              aria-valuemax="300"
              tabindex="0"
            >100</div>
            <span class="bpm-label">BPM</span>
          </div>

          <!-- Slider + nudge -->
          <div class="bpm-controls">
            <input
              type="range"
              class="bpm-slider"
              id="bpmSlider"
              min="20"
              max="300"
              value="100"
              aria-label="BPM slider"
            />
            <div class="bpm-nudge">
              <button class="nudge-btn" data-delta="-10">−10</button>
              <button class="nudge-btn" data-delta="-1">−1</button>
              <button class="nudge-btn" data-delta="1">+1</button>
              <button class="nudge-btn" data-delta="10">+10</button>
            </div>
          </div>

          <!-- Time signature selector -->
          <div class="time-sig-selector">
            <label class="time-sig-label" for="timeSigSelect" data-i18n="metronome.timeSig">Time Signature</label>
            <select class="time-sig-select" id="timeSigSelect" aria-label="Time signature"></select>
          </div>

          <!-- Sound selector -->
          <div class="sound-selector" role="group" aria-label="Metronome sound">
            <button class="sound-btn active" data-sound="click">Click</button>
            <button class="sound-btn" data-sound="woodblock">Woodblock</button>
            <button class="sound-btn" data-sound="hihat">Hi-Hat</button>
            <button class="sound-btn" data-sound="rimshot">Rimshot</button>
            <button class="sound-btn" data-sound="beep">Beep</button>
          </div>

          <!-- Actions -->
          <div class="metronome-actions">
            <button class="tap-btn" id="tapBtn" data-i18n="metronome.tapTempo">Tap Tempo</button>
            <button class="play-btn" id="playBtn" data-i18n="metronome.start">Start</button>
          </div>

        </div>
      </section>

      <!-- ── Practice Timer ─────────────────────────────────── -->
      <section class="timer-section container" id="timer-section" hidden>
        <div class="card timer-card">
          <h2 class="timer-title" data-i18n="timer.title">Practice Timer</h2>
          <div class="timer-display" id="timerDisplay">05:00</div>
          <div class="timer-set">
            <span class="timer-label" data-i18n="timer.setDuration">Set duration</span>
            <div class="timer-inputs">
              <input
                type="number"
                class="timer-input"
                id="timerMinutes"
                min="0"
                max="99"
                value="5"
                aria-label="Minutes"
              />
              <span class="timer-colon">:</span>
              <input
                type="number"
                class="timer-input"
                id="timerSeconds"
                min="0"
                max="59"
                value="0"
                aria-label="Seconds"
              />
            </div>
            <span class="timer-hint" data-i18n="timer.hint">Syncs with metronome — starts &amp; stops automatically</span>
          </div>
        </div>
      </section>

      <!-- ── Rudiments ──────────────────────────────────────── -->
      <section class="rudiments container" id="rudiments-section" hidden>

        <div id="rudimentsToolbar" class="rudiments-toolbar">
          <input
            type="search"
            class="search-input"
            id="rudimentSearch"
            placeholder="Search rudiments…"
            data-i18n-placeholder="rudiments.search"
            aria-label="Search rudiments"
          />
          <div class="filter-pills" data-filter="category" role="group" aria-label="Filter by category"></div>
          <div class="filter-pills" data-filter="difficulty" role="group" aria-label="Filter by difficulty"></div>
        </div>

        <p class="rudiments-count" id="rudimentsCount"></p>

        <div class="rudiments-grid" id="rudimentsGrid"></div>

      </section>

      <!-- ── Drills ──────────────────────────────────────────────────── -->
      <section class="drills container" id="drills-section" hidden>

        <div id="drillsToolbar" class="rudiments-toolbar">
          <input
            type="search"
            class="search-input"
            id="drillSearch"
            placeholder="Search drills…"
            data-i18n-placeholder="drills.search"
            aria-label="Search drills"
          />
          <div class="filter-pills" data-filter="category" role="group" aria-label="Filter by category"></div>
          <div class="filter-pills" data-filter="difficulty" role="group" aria-label="Filter by difficulty"></div>
        </div>

        <p class="drills-count" id="drillsCount"></p>

        <div class="drills-grid" id="drillsGrid"></div>

      </section>

    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Drumio &mdash; <span data-i18n="footer.tagline">Keep the beat.</span></p>
      </div>
    </footer>

    <script src="js/i18n.js?v=11"></script>
    <script src="js/modal.js?v=11"></script>
    <script src="js/metronome.js?v=11"></script>
    <script src="js/rudiments.js?v=11"></script>
    <script src="js/drills.js?v=11"></script>
    <script src="js/app.js?v=11"></script>
  </body>
</html>
